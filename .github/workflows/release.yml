name: Release

# RF-43: cutting a release (tagging vX.Y.Z) publishes the GitHub release
# assets and updates the Homebrew tap formula automatically — no manual
# checksum copy-paste, no manual push to the tap repo.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build release artifacts
        run: make release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping creation."
          else
            gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Publish Homebrew tap formula
        env:
          VERSION: ${{ github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/publish-homebrew-tap.sh
