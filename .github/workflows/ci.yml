name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # The native Windows OpenSSH agent (RF-45) ships disabled by
      # default, even on windows-latest runners — without starting it,
      # ssh-agent-dependent tests just skip silently instead of actually
      # exercising the named-pipe path.
      - name: Start Windows OpenSSH agent
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          if ((Get-Service ssh-agent).Status -ne 'Running') {
            throw "ssh-agent service did not start"
          }

      - run: make test

      - run: make build
